package:
  name: taxcalc
  version: 0.0.0

build:
  entry_points:
    - tc = taxcalc.cli.tc:cli_tc_main

requirements:
  build:
    - "python>=3.13, <3.16"
    - "numpy>=2.5"
    - "pandas>=3.1"
    - "bokeh>=3.10"
    - "paramtools>=0.20.0"
    - "numba==0.68.0"
    - curl
    - openpyxl

  run:
    - "python>=3.13, <3.16"
    - "numpy>=2.5"
    - "pandas>=3.1"
    - "bokeh>=3.10"
    - "paramtools>=0.20.0"
    - "numba==0.68.0"
    - curl
    - openpyxl

test:
  commands:
    - which tc  # [unix]
    - where tc  # [win]
    - tc --help

about:
  home: https://github.com/PSLmodels/Tax-Calculator
