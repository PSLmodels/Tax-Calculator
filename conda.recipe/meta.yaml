package:
  name: taxcalc
  version: 0.0.0

build:
  entry_points:
    - tc = taxcalc.cli.tc:cli_tc_main

requirements:
  build:
    - "python>=3.12, <3.15"
    - "numpy>=2.4"
    - "pandas>=3.0"
    - "bokeh>=3.7"
    - "paramtools>=0.20.0"
    - "numba>=0.64"
    - curl
    - openpyxl

  run:
    - "python>=3.12, <3.15"
    - "numpy>=2.4"
    - "pandas>=3.0"
    - "bokeh>=3.7"
    - "paramtools>=0.20.0"
    - "numba>=0.64"
    - curl
    - openpyxl

test:
  commands:
    - which tc  # [unix]
    - where tc  # [win]
    - tc --help

about:
  home: https://github.com/PSLmodels/Tax-Calculator
